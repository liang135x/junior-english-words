<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>初中英语单词点读</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
body{
  background:#f5f7fa;
  padding:0;
  font-size:16px;
  color:#333;
}
/* 登录面板 */
.login-box{
  max-width:420px;
  margin:80px auto 0;
  background:#fff;
  padding:30px 20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  margin-left:16px;
  margin-right:16px;
}
.login-title{
  text-align:center;
  font-size:18px;
  color:#333;
  margin-bottom:20px;
}
.name-input{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px 10px;
  font-size:16px;
  margin-bottom:16px;
  outline:none;
}
.login-btn{
  width:100%;
  background:#2563eb;
  color:#fff;
  border-radius:8px;
  border:none;
  padding:12px;
  font-size:16px;
  cursor:pointer;
}

/* 固定头部容器 */
.head-fixed{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  background:#f5f7fa;
  padding:8px 10px;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  padding:10px 12px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  gap:10px;
  flex-wrap:wrap;
}
.title{
  font-size:17px;
  color:#222;
  font-weight:500;
  white-space:nowrap;
}
.term-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.term-btn{
  width:30px;
  height:30px;
  line-height:30px;
  text-align:center;
  font-size:14px;
  padding:0;
  margin:0;
  background:transparent;
  border:1px solid #ccc;
  border-radius:4px;
  color:#333;
  cursor:pointer;
}
.term-btn.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

/* 滚动区域，留出顶部空间 */
.scroll-wrap{
  margin-top: calc(48px + 16px);
  padding:0 10px;
  padding-bottom:30px;
}
.audio-item{
  background:#fff;
  padding:14px 16px;
  border-radius:10px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.info-text{
  font-size:16px;
  color:#222;
  font-weight:500;
  flex:1;
  min-width:140px;
}
.num{
  color:#2563eb;
}
.play-btn, .stop-btn{
  padding:10px 12px;
  background:transparent;
  border-radius:8px;
  font-size:18px;
  margin:0;
  color:#2563eb;
  border:none;
  cursor:pointer;
}
.play-btn:disabled, .stop-btn:disabled{
  color:#bbbbbb;
  cursor:not-allowed;
}

/* 歌词弹窗 */
.lyric-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.lyric-box{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  max-height:80vh;
}
.lyric-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid #eee;
}
.lyric-title{
  font-size:16px;
  font-weight:500;
}
.lyric-close{
  border:none;
  background:transparent;
  font-size:22px;
  cursor:pointer;
  color:#666;
}
.lyric-content{
  padding:16px;
  overflow-y:auto;
  flex:1;
}
.lyric-line{
  padding:6px 8px;
  font-size:15px;
  color:#555;
  transition:0.2s;
  border-radius:6px;
  margin:2px 0;
}
.lyric-line.active{
  background-color:#2563eb;
  color:#ffffff;
  font-weight:bold;
  font-size:16px;
}

/* ===== 移动端适配媒体查询 ===== */
@media (max-width: 480px) {
  body {
    font-size:15px;
  }
  .login-box{
    margin-top:40px;
    padding:24px 16px;
  }
  .login-title{
    font-size:16px;
  }
  .head{
    padding:8px 10px;
  }
  .title{
    font-size:15px;
  }
  .term-btn{
    width:28px;
    height:28px;
    line-height:28px;
    font-size:13px;
  }
  .scroll-wrap{
    margin-top: calc(44px + 12px);
  }
  .audio-item{
    padding:12px 14px;
  }
  .info-text{
    font-size:15px;
  }
  .play-btn, .stop-btn{
    padding:8px 10px;
    font-size:17px;
  }
  .lyric-line{
    font-size:14px;
  }
  .lyric-line.active{
    font-size:15px;
  }
}
</style>
</head>

  currentLyricIndex: -1

// LRC解析函数
function parseLrc(lrcStr){
  const lines = lrcStr.split('\n');
  const result = [];
  const reg = /\[(\d{2}):(\d{2})\.(\d{2})\]/;
  for(const line of lines){
    const m = line.match(reg);
    if(!m) continue;
    const min = Number(m[1]);
    const sec = Number(m[2]);
    const ms = Number(m[3]);
    const time = min * 60 + sec + ms / 100;
    const text = line.replace(reg, '').trim();
    result.push({time, text});
  }
  return result.sort((a,b)=>a.time - b.time);
}

// 更新歌词高亮
function updateLyric(currentTime){
  if(!data.lyricList.length) return;
  let idx = -1;
  for(let i=0; i<data.lyricList.length; i++){
    if(data.lyricList[i].time <= currentTime){
      idx = i;
    }else{
      break;
    }
  }
  if(idx === data.currentLyricIndex) return;
  data.currentLyricIndex = idx;
  const doms = document.querySelectorAll('.lyric-line');
  doms.forEach((el,i)=>{
    el.classList.toggle('active', i === idx);
    if(i === idx) el.scrollIntoView({behavior:'smooth', block:'center'});
  })
}

// 打开歌词面板
function openLyric(name){
  const mask = document.getElementById('lyricMask');
  const titleEl = document.getElementById('lyricTitle');
  const contentEl = document.getElementById('lyricContent');
  const raw = data.lyricLib[name];
  if(!raw){
    contentEl.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">暂无该音频歌词</div>';
    data.lyricList = [];
  }else{
    data.lyricList = parseLrc(raw);
    contentEl.innerHTML = data.lyricList.map(item=>`<div class="lyric-line">${item.text}</div>`).join('');
  }
  titleEl.innerText = `歌词：${name}`;
  mask.style.display = 'flex';
  data.currentLyricIndex = -1;
}

function closeLyric(){
  document.getElementById('lyricMask').style.display = 'none';
  data.lyricList = [];
  data.currentLyricIndex = -1;
  if(data.lyricTimer){
    clearInterval(data.lyricTimer);
    data.lyricTimer = null;
  }
}

// 释放屏幕唤醒锁
async function releaseWakeLock() {
  if (data.wakeLockSentinel && !data.wakeLockSentinel.released) {
    await data.wakeLockSentinel.release();
  }
  data.wakeLockSentinel = null;
}

// 请求屏幕唤醒锁
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) {
    return;
  }
  try {
    data.wakeLockSentinel = await navigator.wakeLock.request('screen');
    data.wakeLockSentinel.addEventListener('release', () => {
      data.wakeLockSentinel = null;
    });
  } catch (err) {
    console.warn("唤醒锁获取失败：", err);
  }
}

// 本地存储
function loadData(){
  const str = localStorage.getItem("audioReadData");
  if(str) data.readRecord = JSON.parse(str);
}
function saveData(){
  localStorage.setItem("audioReadData", JSON.stringify(data.readRecord));
}

// 渲染学期按钮
function renderTermButtons(){
  const wrap = document.getElementById("termWrap");
  wrap.innerHTML = "";
  data.termList.forEach(item=>{
    const btn = document.createElement("button");
    btn.className = "term-btn" + (data.currentTerm === item.term ? " active" : "");
    btn.innerText = item.label;
    btn.dataset.term = item.term;
    btn.onclick = ()=> switchTerm(item.term);
    wrap.appendChild(btn);
  })
}

// 渲染音频列表
function renderList(){
  const user = data.currentUser;
  if(!data.readRecord[user]) data.readRecord[user] = {};
  const cfg = data.termAudioConfig[data.currentTerm];
  data.audioList = cfg.map((item, idx)=>{
    const count = data.readRecord[user][item.name] ?? 0;
    const isPlaying = data.currentPlayIndex === idx && data.audio && !data.audio.paused;
    const disabled = data.currentPlayIndex !== -1 && data.currentPlayIndex !== idx;
    return { ...item, count, playing: isPlaying, disabled }
  })
  const listWrap = document.getElementById("audioListWrap");
  listWrap.innerHTML = "";
  data.audioList.forEach((item, idx)=>{
    const div = document.createElement("div");
    div.className = "audio-item";
    div.innerHTML = `
      <div class="info-text">${item.name}：已点读 <span class="num">${item.count}</span> 次</div>
      <button class="play-btn" ${item.disabled ? "disabled" : ""}>${item.playing ? "⏸" : "▶"}</button>
      <button class="stop-btn" ${item.disabled ? "disabled" : ""}>⏹</button>
    `
    div.querySelector(".play-btn").onclick = ()=> handlePlay(idx);
    div.querySelector(".stop-btn").onclick = ()=> handleStop(idx);
    listWrap.appendChild(div);
  })
}

async function resetPlayState(){
  if(data.lyricTimer){
    clearInterval(data.lyricTimer);
    data.lyricTimer = null;
  }
  closeLyric();
  if(data.audio){
    data.audio.pause();
    data.audio.currentTime = 0;
    data.audio = null;
  }
  data.currentPlayIndex = -1;
  await releaseWakeLock();
  renderList();
}

function switchTerm(term){
  data.currentTerm = Number(term);
  resetPlayState();
  renderTermButtons();
  renderList();
}

async function handlePlay(idx){
  const item = data.audioList[idx];
  if(data.currentPlayIndex === idx){
    if(data.audio.paused){
      data.audio.play();
      await requestWakeLock();
      data.lyricTimer = setInterval(()=> updateLyric(data.audio.currentTime), 200);
    }else{
      data.audio.pause();
      await releaseWakeLock();
      if(data.lyricTimer){clearInterval(data.lyricTimer);data.lyricTimer=null;}
    }
    renderList();
    return;
  }
  await resetPlayState();
  const au = new Audio(item.src);
  au.currentTime = 0;
  au.play().catch(e=>{
    alert("播放失败：浏览器限制，需要先交互");
  })
  data.audio = au;
  data.currentPlayIndex = idx;
  openLyric(item.name);
  data.lyricTimer = setInterval(()=> updateLyric(data.audio.currentTime), 200);
  await requestWakeLock();

  au.onplay = async ()=> {
    await requestWakeLock();
    renderList();
  };
  au.onpause = async ()=> {
    await releaseWakeLock();
    if(data.lyricTimer){clearInterval(data.lyricTimer);data.lyricTimer=null;}
    renderList();
  };
  au.onended = async ()=>{
    data.readRecord[data.currentUser][item.name] = (data.readRecord[data.currentUser][item.name] || 0) + 1;
    saveData();
    await resetPlayState();
  }
  renderList();
}

async function handleStop(idx){
  if(data.currentPlayIndex === idx){
    await resetPlayState();
  }
}

function login(){
  const name = document.getElementById("userNameInput").value.trim();
  if(!name){
    alert("请输入姓名");
    return;
  }
  data.isLogin = true;
  data.currentUser = name;
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("mainBox").style.display = "block";
  document.getElementById("welcomeText").innerText = "欢迎："+name;
  renderTermButtons();
  renderList();
}

// 绑定事件
document.getElementById("loginBtn").onclick = login;
document.getElementById("userNameInput").onkeydown = e=>{
  if(e.key === "Enter") login();
}
document.getElementById("lyricClose").onclick = closeLyric;
// 点击遮罩关闭歌词
document.getElementById("lyricMask").onclick = e=>{
  if(e.target.id === "lyricMask") closeLyric();
}

// 页面失去焦点再切回来时，如果正在播放，尝试重新拿锁
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && data.currentPlayIndex !== -1 && data.audio && !data.audio.paused) {
    await requestWakeLock();
  }
});

// 初始化
loadData();
